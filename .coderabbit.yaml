# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 리뷰 기준은 AGENTS.md다. 여기서는 저장소 규칙과 맞지 않아 반복해서 반려한 기본 검사만 끈다.
# 적지 않은 설정(리뷰 언어 등)은 CodeRabbit UI 설정을 이어받는다. 빼면 기본값(영어)으로 돌아간다(#238).
inheritance: true
reviews:
  pre_merge_checks:
    # 이 저장소는 함수 docstring 기준을 두지 않는다. #231, #235, #237에서 같은 이유로 반려했다(#238).
    docstrings:
      mode: "off"
